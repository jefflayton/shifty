on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Update Version
        run: |
          VERSION="${{ forgejo.ref_name }}"
          VERSION="${VERSION#v}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" \
            platforms/macos/Info.plist

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            platforms/macos/Info.plist

      - name: Build
        run: zig build

      - name: Generate appcast.xml
        run: |
          mkdir -p _site
          cp zig-out/Shifty.dmg _site/

          .cache/sparkle/bin/generate_appcast \
            --download-url-prefix "https://jefflayton.codeberg.page/shifty/" \
            -o _site/appcast.xml _site

      - name: Deploy to Pages
        run: |
          cd _site
          git init -q
          git checkout -q -b pages
          git add -A
          git -c user.name=ci -c user.email=ci@shifty commit -q -m "deploy ${{ forgejo.ref_name }}"
          git push -qf "https://${{ forgejo.token }}@codeberg.org/${{ forgejo.repository }}.git" pages
