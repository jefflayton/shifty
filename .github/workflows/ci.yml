name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write # draft release upkeep

jobs:
    # Core, CLI, and TUI build and test on Linux.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: jdx/mise-action@v3
              with:
                  install_args: zig deno

            - name: Test
              run: zig build test

            - name: Test release scripts
              run: deno test --allow-run --allow-env .github/scripts

            - name: Build TUI + CLI
              run: zig build tui cli

    # The app needs swiftc/AppKit: compile it and run its model tests.
    macos:
        # macOS draws an app in the style of the SDK it was built against, so
        # build with the latest Xcode/SDK (as on a dev Mac), not macos-15's
        # Xcode 16. The deployment target (macOS 15) is set in build.zig.
        runs-on: xcode-27
        steps:
            - uses: actions/checkout@v5

            - name: Show SDK
              run: xcodebuild -version && xcrun --show-sdk-version

            - uses: jdx/mise-action@v3
              with:
                  install_args: zig

            - name: Test app models
              run: zig build test-macos

            - name: Build app
              run: zig build macos

    draft-release:
        if: github.event_name == 'push'
        needs: [test, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@v3
              with:
                  install_args: deno

            - name: Update draft release
              env:
                  API: ${{ github.api_url }}/repos/${{ github.repository }}
                  TOKEN: ${{ github.token }}
              run: deno task release-notes --draft
