name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write # draft release upkeep

jobs:
    # Core, CLI, and TUI build and test on Linux.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: jdx/mise-action@v3
              with:
                  install_args: zig

            - name: Test
              run: zig build test

            - name: Build TUI + CLI
              run: zig build tui cli

    # The app needs swiftc/AppKit: compile it and run its model tests.
    macos:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v5

            - uses: jdx/mise-action@v3
              with:
                  install_args: zig

            - name: Test app models
              run: zig build test-macos

            - name: Build app
              run: zig build macos

    draft-release:
        if: github.event_name == 'push'
        needs: [test, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@v3
              with:
                  install_args: deno

            - name: Update draft release
              env:
                  API: ${{ github.api_url }}/repos/${{ github.repository }}
                  TOKEN: ${{ github.token }}
              run: deno task release-notes --draft
