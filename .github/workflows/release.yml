name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to stamp for the test build (no release side-effects)"
                default: "0.0.0-dev"

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write

env:
    PAGES_URL: https://jefflayton.github.io/shifty/

jobs:
    build:
        runs-on: macos-15
        env:
            IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@v3
              with:
                  install_args: zig deno

            - name: Resolve version
              id: ver
              run: |
                  case "${{ github.ref }}" in
                    refs/tags/*)
                      V="${{ github.ref_name }}"; V="${V#v}"
                      case "$V" in
                        [0-9]*.[0-9]*.[0-9]*) : ;;
                        *) echo "Tag '$V' is not X.Y.Z semver."; exit 1 ;;
                      esac ;;
                    *)
                      V="${{ inputs.version }}"; V="${V#v}" ;;
                  esac
                  echo "version=$V" >> "$GITHUB_OUTPUT"
                  echo "Building version $V (release=$IS_RELEASE)"

            - name: Stamp Info.plist
              run: |
                  V="${{ steps.ver.outputs.version }}"
                  /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" platforms/macos/Info.plist
                  /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" platforms/macos/Info.plist

            - name: Test
              run: zig build test

            # Naming any step replaces the default `install` step, so list it
            # explicitly or the app and DMG are never built.
            - name: Build
              run: zig build -Dbundle install sparkle-tools

            - name: Check build outputs
              run: test -f zig-out/Shifty.dmg && test -x zig-out/sparkle/bin/generate_appcast

            - name: Upload dmg artifact (always)
              uses: actions/upload-artifact@v4
              with:
                  name: Shifty-${{ steps.ver.outputs.version }}-dmg
                  path: zig-out/Shifty.dmg
                  retention-days: 1

            - name: Stage dmg + release notes
              env:
                  API: ${{ github.api_url }}/repos/${{ github.repository }}
                  TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  mkdir -p _site
                  cp zig-out/Shifty.dmg _site/
                  # Notes file named after the archive -> generate_appcast embeds it.
                  if [ "$IS_RELEASE" = "true" ]; then
                    deno task release-notes --out _site/Shifty.md
                  fi

            - name: Generate appcast.xml
              if: env.IS_RELEASE == 'true'
              env:
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
              run: |
                  printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | zig-out/sparkle/bin/generate_appcast \
                    --ed-key-file - \
                    --download-url-prefix "$PAGES_URL" \
                    -o _site/appcast.xml _site
                  # A key that doesn't match SUPublicEDKey only warns and leaves
                  # the enclosure unsigned, which Sparkle clients reject.
                  if ! grep -q 'sparkle:edSignature' _site/appcast.xml; then
                    echo "::error::appcast.xml is unsigned; SPARKLE_ED_PRIVATE_KEY does not match SUPublicEDKey in Info.plist"
                    exit 1
                  fi

            - name: Upload Pages artifact
              if: env.IS_RELEASE == 'true'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

            - name: Publish release notes + dmg
              if: env.IS_RELEASE == 'true'
              env:
                  API: ${{ github.api_url }}/repos/${{ github.repository }}
                  TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  deno task release-notes --publish --asset zig-out/Shifty.dmg

    deploy-pages:
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - id: deploy
              uses: actions/deploy-pages@v4
