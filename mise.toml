[env]
SPARKLE_VERSION = "2.9.2"

[tools]
deno = "latest"
watchexec = "latest"
zig = "0.16.0"
zls = "0.16.0"

[tasks.build]
alias = "b"
run = '''
#!/usr/bin/env bash
pkill -x shifty
zig build
'''
sources = ["src/**/*", "build.zig"]
outputs = ["zig-out/Shifty.app/Contents/MacOS/shifty"]

[tasks.run]
alias = "r"
run = "open zig-out/Shifty.app"
depends = ["build"]

[tasks.log]
run = "tail -F ~/Library/Logs/Shifty/shifty.log"
