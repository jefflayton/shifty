[tools]
deno = "latest"
watchexec = "latest"
zig = "0.16.0"
zls = "0.16.0"

# --- macOS app ---
[tasks."build:macos"]
alias = "bm"
run = '''
#!/usr/bin/env bash
pkill -x shifty
zig build macos
'''
sources = ["src/**/*", "build.zig", "platforms/macos/**/*"]
outputs = ["zig-out/Shifty.app/Contents/MacOS/shifty"]

[tasks."run:macos"]
alias = "rm"
depends = ["build:macos"]
run = "open zig-out/Shifty.app"

[tasks.log]
run = "tail -F ~/Library/Logs/Shifty/shifty.log"

# --- TUI ---
[tasks."build:tui"]
alias = "bt"
run = "zig build tui"

[tasks."run:tui"]
alias = "rt"
run = "zig build run-tui"

# --- CLI ---
[tasks."build:cli"]
alias = "bc"
run = "zig build cli"

[tasks."run:cli"]
alias = "rc"
run = "zig build run-cli --"

# --- shared ---
[tasks.test]
alias = "t"
run = "zig build test"

[tasks."build:all"]
run = "zig build all"
